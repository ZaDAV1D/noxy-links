<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>noxy</title>

<meta name="description" content="Official social links">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,
body{
    width:100%;
    min-height:100%;
}

body{
    font-family:"Inter",sans-serif;
    color:#fff;
    background:#030303;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
}

.background{
    position:fixed;
    inset:0;
    z-index:-10;
    overflow:hidden;

    background:
        radial-gradient(
            circle at 15% 20%,
            rgba(255,70,0,.18),
            transparent 28%
        ),
        radial-gradient(
            circle at 85% 75%,
            rgba(255,120,0,.14),
            transparent 30%
        ),
        radial-gradient(
            circle at 50% 50%,
            rgba(255,60,0,.06),
            transparent 45%
        ),
        #030303;
}

.background::before{
    content:"";

    position:absolute;

    width:800px;
    height:800px;

    top:-400px;
    left:-300px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,70,0,.28),
            transparent 65%
        );

    filter:blur(70px);

    animation:
        orangeGlow1 14s ease-in-out infinite alternate;
}

.background::after{
    content:"";

    position:absolute;

    width:750px;
    height:750px;

    right:-350px;
    bottom:-350px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,130,0,.23),
            transparent 65%
        );

    filter:blur(70px);

    animation:
        orangeGlow2 17s ease-in-out infinite alternate;
}

@keyframes orangeGlow1{
    0%{
        transform:translate(0,0) scale(1);
    }

    100%{
        transform:translate(220px,180px) scale(1.25);
    }
}

@keyframes orangeGlow2{
    0%{
        transform:translate(0,0) scale(1);
    }

    100%{
        transform:translate(-180px,-150px) scale(1.2);
    }
}

#particles{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:-5;
    pointer-events:none;
}

#startScreen{
    position:fixed;
    inset:0;
    z-index:10000;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 50% 45%,
            rgba(255,70,0,.13),
            transparent 25%
        ),
        radial-gradient(
            circle at 20% 80%,
            rgba(255,90,0,.07),
            transparent 30%
        ),
        #020202;

    transition:
        opacity 1s cubic-bezier(.16,1,.3,1),
        visibility 1s;
}

#startScreen.hide{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
}

.start-background-glow{
    position:absolute;

    width:700px;
    height:700px;

    left:50%;
    top:50%;

    transform:translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,70,0,.20),
            rgba(255,70,0,.06) 30%,
            transparent 70%
        );

    filter:blur(40px);

    animation:
        startGlow 5s ease-in-out infinite alternate;
}

@keyframes startGlow{
    from{
        transform:translate(-50%,-50%) scale(.85);
        opacity:.65;
    }

    to{
        transform:translate(-50%,-50%) scale(1.15);
        opacity:1;
    }
}

.start-grid{
    position:absolute;
    inset:-50%;

    opacity:.12;

    background-image:
        linear-gradient(
            rgba(255,100,30,.15) 1px,
            transparent 1px
        ),
        linear-gradient(
            90deg,
            rgba(255,100,30,.15) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    transform:
        perspective(500px)
        rotateX(65deg)
        translateY(100px)
        scale(1.5);

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 35%,
            black 70%,
            transparent
        );

    animation:
        gridMove 12s linear infinite;
}

@keyframes gridMove{
    from{
        background-position:0 0;
    }

    to{
        background-position:0 55px;
    }
}

.start-content{
    position:relative;
    z-index:5;

    display:flex;
    flex-direction:column;
    align-items:center;

    text-align:center;

    animation:
        startContentIn 1.2s cubic-bezier(.16,1,.3,1);
}

@keyframes startContentIn{
    from{
        opacity:0;
        transform:translateY(35px) scale(.92);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.start-logo-area{
    position:relative;

    width:220px;
    height:220px;

    display:flex;
    justify-content:center;
    align-items:center;

    margin-bottom:22px;
}

.start-logo-glow{
    position:absolute;

    width:145px;
    height:145px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,90,0,.65),
            rgba(255,60,0,.2) 45%,
            transparent 70%
        );

    filter:blur(20px);

    animation:
        logoGlow 2.5s ease-in-out infinite alternate;
}

@keyframes logoGlow{
    from{
        transform:scale(.85);
        opacity:.6;
    }

    to{
        transform:scale(1.15);
        opacity:1;
    }
}

.start-logo{
    position:relative;
    z-index:3;

    width:145px;
    height:145px;

    object-fit:cover;

    border-radius:50%;

    border:
        2px solid
        rgba(255,120,50,.8);

    box-shadow:
        0 0 20px rgba(255,70,0,.45),
        0 0 70px rgba(255,70,0,.25),
        inset 0 0 30px rgba(255,255,255,.05);

    animation:
        logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,
    100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-7px) scale(1.025);
    }
}

.start-orbit{
    position:absolute;

    border-radius:50%;

    border:
        1px solid
        rgba(255,100,30,.35);

    pointer-events:none;
}

.orbit-one{
    width:190px;
    height:190px;

    border-top-color:
        rgba(255,120,40,.9);

    border-bottom-color:
        transparent;

    animation:
        orbitSpin 5s linear infinite;
}

.orbit-two{
    width:210px;
    height:210px;

    transform:rotate(60deg);

    border-left-color:
        rgba(255,80,0,.8);

    border-right-color:
        transparent;

    animation:
        orbitSpinReverse 7s linear infinite;
}

.orbit-three{
    width:225px;
    height:225px;

    transform:rotate(120deg);

    border-top-color:
        rgba(255,160,70,.45);

    border-bottom-color:
        transparent;

    animation:
        orbitSpin 11s linear infinite;
}

@keyframes orbitSpin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes orbitSpinReverse{
    to{
        transform:rotate(-360deg);
    }
}

.start-small{
    font-size:11px;

    letter-spacing:5px;

    font-weight:700;

    color:
        rgba(255,255,255,.45);

    margin-bottom:8px;
}

.start-title{
    margin:0;

    font-size:52px;

    line-height:1;

    font-weight:800;

    letter-spacing:-2.5px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ff6a00,
            #ffb067,
            #fff
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        titleGradient 5s linear infinite;
}

@keyframes titleGradient{
    to{
        background-position:250% center;
    }
}

.start-line{
    display:flex;

    align-items:center;

    gap:10px;

    width:180px;

    margin:18px 0 12px;
}

.start-line span{
    flex:1;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,100,30,.7)
        );
}

.start-line span:last-child{
    background:
        linear-gradient(
            90deg,
            rgba(255,100,30,.7),
            transparent
        );
}

.start-line i{
    font-size:5px;

    color:#ff6500;

    filter:
        drop-shadow(
            0 0 6px #ff6500
        );
}

.start-subtitle{
    color:
        rgba(255,255,255,.5);

    font-size:13px;

    letter-spacing:.5px;
}

.start-button{
    position:relative;

    width:230px;
    height:62px;

    margin-top:30px;

    border:none;

    border-radius:18px;

    overflow:hidden;

    cursor:pointer;

    font-family:inherit;

    color:#fff;

    background:
        linear-gradient(
            135deg,
            #ff4d00,
            #ff7300
        );

    box-shadow:
        0 0 25px rgba(255,70,0,.35),
        0 15px 45px rgba(0,0,0,.5);

    transition:
        transform .3s cubic-bezier(.16,1,.3,1),
        box-shadow .3s ease;
}

.start-button:hover{
    transform:
        translateY(-5px)
        scale(1.035);

    box-shadow:
        0 0 45px rgba(255,70,0,.55),
        0 20px 55px rgba(0,0,0,.55);
}

.start-button:active{
    transform:
        translateY(-1px)
        scale(.98);
}

.button-content{
    position:relative;
    z-index:3;

    display:flex;

    justify-content:center;
    align-items:center;

    gap:10px;

    height:100%;

    font-size:14px;

    font-weight:800;

    letter-spacing:2px;
}

.button-shine{
    position:absolute;

    top:0;
    left:-100%;

    width:70%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.35),
            transparent
        );

    transform:skewX(-20deg);

    animation:
        buttonShine 3s ease-in-out infinite;
}

@keyframes buttonShine{
    0%{
        left:-100%;
    }

    45%,
    100%{
        left:140%;
    }
}

.start-hint{
    margin-top:15px;

    font-size:9px;

    letter-spacing:3px;

    color:
        rgba(255,255,255,.22);

    animation:
        hintPulse 2s ease-in-out infinite;
}

@keyframes hintPulse{
    50%{
        opacity:.45;
    }
}

.wrapper{
    min-height:100vh;
    width:100%;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:25px;

    perspective:1200px;

    opacity:0;

    transform:scale(.96);

    transition:
        opacity .8s ease,
        transform .8s ease;
}

.wrapper.show{
    opacity:1;
    transform:scale(1);
}

.card{
    position:relative;

    width:min(540px,100%);

    max-height:
        calc(100vh - 50px);

    padding:36px;

    border-radius:32px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.025)
        );

    border:
        1px solid
        rgba(255,255,255,.13);

    backdrop-filter:
        blur(35px)
        saturate(130%);

    -webkit-backdrop-filter:
        blur(35px)
        saturate(130%);

    box-shadow:
        0 30px 100px rgba(0,0,0,.75),
        inset 0 1px 0 rgba(255,255,255,.08),
        0 0 80px rgba(255,70,0,.035);

    transform-style:preserve-3d;

    transition:
        transform .15s ease-out;

    overflow-y:auto;

    scrollbar-width:none;
}

.card::-webkit-scrollbar{
    display:none;
}

.card::before{
    content:"";

    position:absolute;

    inset:0;

    border-radius:inherit;

    pointer-events:none;

    background:
        linear-gradient(
            135deg,
            rgba(255,100,0,.18),
            transparent 25%,
            transparent 75%,
            rgba(255,70,0,.08)
        );

    opacity:.8;
}

.profile{
    position:relative;
    z-index:2;

    text-align:center;
}

.avatar-box{
    position:relative;

    width:145px;
    height:145px;

    margin:0 auto;
}

.avatar-ring{
    position:absolute;

    inset:-5px;

    border-radius:50%;

    background:
        conic-gradient(
            from 0deg,
            #ff4d00,
            #ff9d00,
            #ff4d00,
            #6b1d00,
            #ff7a00,
            #ff4d00
        );

    animation:
        avatarRotate 6s linear infinite;

    filter:
        drop-shadow(
            0 0 18px
            rgba(255,70,0,.35)
        );
}

.avatar-ring::after{
    content:"";

    position:absolute;

    inset:3px;

    border-radius:50%;

    background:#050505;
}

.avatar{
    position:absolute;

    inset:5px;

    z-index:2;

    width:135px;
    height:135px;

    object-fit:cover;

    border-radius:50%;

    background:#050505;
}

@keyframes avatarRotate{
    to{
        transform:rotate(360deg);
    }
}

.name{
    margin-top:20px;

    font-size:43px;

    font-weight:800;

    letter-spacing:-2px;

    background:
        linear-gradient(
            90deg,
            #fff,
            #ff8a00,
            #fff
        );

    background-size:200% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        gradientMove 5s linear infinite;
}

@keyframes gradientMove{
    to{
        background-position:200% center;
    }
}

.description{
    margin-top:8px;

    color:
        rgba(255,255,255,.55);

    font-size:14px;
}

.status{
    display:inline-flex;

    align-items:center;

    gap:8px;

    margin-top:15px;

    padding:7px 13px;

    border-radius:999px;

    background:
        rgba(255,255,255,.04);

    border:
        1px solid
        rgba(255,255,255,.08);

    color:
        rgba(255,255,255,.6);

    font-size:12px;
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#ff6500;

    box-shadow:
        0 0 12px
        rgba(255,80,0,.9);

    animation:
        statusPulse 1.7s ease-in-out infinite;
}

@keyframes statusPulse{
    50%{
        opacity:.35;
        transform:scale(.7);
    }
}

.links{
    position:relative;

    z-index:2;

    margin-top:26px;
}

.link{
    position:relative;

    width:100%;

    min-height:59px;

    margin:10px 0;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:12px;

    border-radius:17px;

    color:#fff;

    text-decoration:none;

    font-size:15px;

    font-weight:700;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid
        rgba(255,255,255,.09);

    overflow:hidden;

    transition:
        transform .25s cubic-bezier(.16,1,.3,1),
        background .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
}

.link::before{
    content:"";

    position:absolute;

    top:0;
    bottom:0;

    left:-120%;

    width:80%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.18),
            transparent
        );

    transform:skewX(-20deg);

    transition:left .65s ease;
}

.link:hover::before{
    left:140%;
}

.link:hover{
    transform:
        translateY(-4px)
        scale(1.015);

    background:
        linear-gradient(
            135deg,
            rgba(255,90,0,.11),
            rgba(255,255,255,.055)
        );

    border-color:
        rgba(255,100,0,.35);

    box-shadow:
        0 12px 35px rgba(0,0,0,.35),
        0 0 25px rgba(255,70,0,.08);
}

.link:active{
    transform:
        translateY(-1px)
        scale(.99);
}

.link i{
    width:23px;
    text-align:center;
    font-size:18px;
}

.link.special{
    background:
        linear-gradient(
            135deg,
            rgba(255,80,0,.18),
            rgba(255,130,0,.06)
        );

    border-color:
        rgba(255,100,0,.35);
}

.footer{
    position:relative;

    z-index:2;

    margin-top:22px;

    text-align:center;

    color:
        rgba(255,255,255,.25);

    font-size:11px;
}

@media(max-width:600px){

    body{
        overflow:auto;
    }

    .start-logo-area{
        width:185px;
        height:185px;
    }

    .start-logo{
        width:120px;
        height:120px;
    }

    .orbit-one{
        width:165px;
        height:165px;
    }

    .orbit-two{
        width:180px;
        height:180px;
    }

    .orbit-three{
        width:195px;
        height:195px;
    }

    .start-title{
        font-size:40px;
    }

    .start-button{
        width:205px;
        height:58px;
    }

    .wrapper{
        padding:15px;
    }

    .card{
        padding:26px;
        max-height:calc(100vh - 30px);
        border-radius:27px;
    }

    .avatar-box{
        width:120px;
        height:120px;
    }

    .avatar{
        width:110px;
        height:110px;
    }

    .name{
        font-size:34px;
        letter-spacing:-1px;
    }
}

@media(prefers-reduced-motion:reduce){

    *,
    *::before,
    *::after{
        animation-duration:.01ms !important;
        animation-iteration-count:1 !important;
        transition-duration:.01ms !important;
    }
}

</style>
</head>

<script>

const startScreen =
    document.getElementById("startScreen");

const enterButton =
    document.getElementById("enterButton");

const main =
    document.getElementById("main");

enterButton.addEventListener("click", () => {

    startScreen.classList.add("hide");

    setTimeout(() => {

        main.classList.add("show");

    },250);

});

document
    .querySelectorAll(".social-link")
    .forEach(link => {

        const href =
            link
                .getAttribute("href")
                ?.trim();

        if(
            !href ||
            href === "#" ||
            href.toLowerCase() === "none"
        ){

            link.remove();

        }

    });

const card =
    document.getElementById("card");

let mouseX = 0;
let mouseY = 0;

let currentX = 0;
let currentY = 0;

document.addEventListener("mousemove", event => {

    mouseX =
        (
            event.clientX /
            window.innerWidth
            - .5
        ) * 10;

    mouseY =
        (
            event.clientY /
            window.innerHeight
            - .5
        ) * -10;

});

function smoothCard(){

    currentX +=
        (mouseX - currentX) * .08;

    currentY +=
        (mouseY - currentY) * .08;

    card.style.transform =
        `
        rotateX(${currentY}deg)
        rotateY(${currentX}deg)
        `;

    requestAnimationFrame(
        smoothCard
    );
}

smoothCard();

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");

let width = 0;
let height = 0;
let particles = [];

function resize(){

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    const ratio =
        window.devicePixelRatio || 1;

    canvas.width =
        width * ratio;

    canvas.height =
        height * ratio;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

    const amount =
        Math.min(
            100,
            Math.floor(
                width * height / 15000
            )
        );

    particles =
        Array.from(
            {length:amount},
            () => ({

                x:
                    Math.random() * width,

                y:
                    Math.random() * height,

                vx:
                    (Math.random() - .5) * .35,

                vy:
                    (Math.random() - .5) * .35,

                size:
                    Math.random() * 1.5 + .5

            })
        );
}

resize();

window.addEventListener(
    "resize",
    resize
);

function animateParticles(){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    for(
        let i = 0;
        i < particles.length;
        i++
    ){

        const a =
            particles[i];

        a.x += a.vx;
        a.y += a.vy;

        if(
            a.x < 0 ||
            a.x > width
        ){
            a.vx *= -1;
        }

        if(
            a.y < 0 ||
            a.y > height
        ){
            a.vy *= -1;
        }

        ctx.fillStyle =
            "rgba(255,120,40,.7)";

        ctx.beginPath();

        ctx.arc(
            a.x,
            a.y,
            a.size,
            0,
            Math.PI * 2
        );

        ctx.fill();

        for(
            let j = i + 1;
            j < particles.length;
            j++
        ){

            const b =
                particles[j];

            const dx =
                a.x - b.x;

            const dy =
                a.y - b.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );

            if(
                distance < 115
            ){

                const opacity =
                    (
                        1 -
                        distance / 115
                    ) * .18;

                ctx.strokeStyle =
                    `rgba(255,100,30,${opacity})`;

                ctx.lineWidth = .6;

                ctx.beginPath();

                ctx.moveTo(
                    a.x,
                    a.y
                );

                ctx.lineTo(
                    b.x,
                    b.y
                );

                ctx.stroke();

            }
        }
    }

    requestAnimationFrame(
        animateParticles
    );
}

animateParticles();

</script>
