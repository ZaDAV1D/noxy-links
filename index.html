
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>noxy</title>

<meta name="description" content="noxy — Official social links">
<meta name="theme-color" content="#050505">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://cdnjs.cloudflare.com">

<link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap"
    rel="stylesheet"
>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    width:100%;
    min-height:100%;
    scroll-behavior:smooth;
}

body{
    width:100%;
    min-height:100vh;

    font-family:"Inter",sans-serif;

    color:#fff;

    background:#030303;

    overflow:hidden;

    -webkit-font-smoothing:antialiased;
    text-rendering:optimizeLegibility;

    /* Anti select */
    -webkit-user-select:none;
    -moz-user-select:none;
    user-select:none;

    /* Anti touch callout */
    -webkit-touch-callout:none;
}

/* =========================================================
   VARIABLES
========================================================= */

:root{

    --orange:#ff5a00;
    --orange-light:#ff8a00;
    --orange-dark:#b83200;

    --white:#ffffff;

    --glass:rgba(255,255,255,.055);
    --glass-hover:rgba(255,255,255,.085);

    --border:rgba(255,255,255,.10);
    --border-hover:rgba(255,100,0,.42);

    --muted:rgba(255,255,255,.52);

    --shadow:rgba(0,0,0,.7);

}

/* =========================================================
   PROTECTION
========================================================= */

/* Prevent selecting text/images */

body,
body *{
    -webkit-user-select:none !important;
    -moz-user-select:none !important;
    user-select:none !important;

    -webkit-touch-callout:none !important;
}

/* Images cannot be dragged */

img{
    -webkit-user-drag:none;
    user-drag:none;

    pointer-events:none;
}

/*
   Keep actual buttons/links clickable.
   Their icons/images remain non-draggable.
*/

button,
a{
    -webkit-user-select:none !important;
    user-select:none !important;
}

/* =========================================================
   BACKGROUND
========================================================= */

.background{
    position:fixed;
    inset:0;

    z-index:-20;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 10% 10%,
            rgba(255,70,0,.18),
            transparent 27%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(255,110,0,.13),
            transparent 30%
        ),

        radial-gradient(
            circle at 50% 45%,
            rgba(255,60,0,.055),
            transparent 45%
        ),

        #030303;
}

.background::before{
    content:"";

    position:absolute;

    width:900px;
    height:900px;

    top:-450px;
    left:-350px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,70,0,.30),
            transparent 68%
        );

    filter:blur(75px);

    animation:
        backgroundGlowOne 16s ease-in-out infinite alternate;
}

.background::after{
    content:"";

    position:absolute;

    width:850px;
    height:850px;

    right:-400px;
    bottom:-400px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,130,0,.22),
            transparent 68%
        );

    filter:blur(80px);

    animation:
        backgroundGlowTwo 18s ease-in-out infinite alternate;
}

@keyframes backgroundGlowOne{

    0%{
        transform:translate(0,0) scale(1);
    }

    100%{
        transform:translate(260px,210px) scale(1.3);
    }

}

@keyframes backgroundGlowTwo{

    0%{
        transform:translate(0,0) scale(1);
    }

    100%{
        transform:translate(-220px,-190px) scale(1.25);
    }

}

/* =========================================================
   NOISE
========================================================= */

.noise{
    position:fixed;
    inset:0;

    z-index:-3;

    pointer-events:none;

    opacity:.035;

    background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.45'/%3E%3C/svg%3E");

    mix-blend-mode:screen;
}

/* =========================================================
   CURSOR GLOW
========================================================= */

.cursor-glow{
    position:fixed;

    width:280px;
    height:280px;

    left:0;
    top:0;

    z-index:-2;

    pointer-events:none;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,80,0,.10),
            transparent 68%
        );

    filter:blur(12px);

    transform:translate(-50%,-50%);
}

/* =========================================================
   PARTICLES
========================================================= */

#particles{
    position:fixed;

    inset:0;

    width:100%;
    height:100%;

    z-index:-5;

    pointer-events:none;
}

/* =========================================================
   START SCREEN
========================================================= */

#startScreen{
    position:fixed;

    inset:0;

    z-index:10000;

    display:flex;

    justify-content:center;
    align-items:center;

    overflow:hidden;

    background:

        radial-gradient(
            circle at 50% 45%,
            rgba(255,70,0,.14),
            transparent 26%
        ),

        radial-gradient(
            circle at 20% 80%,
            rgba(255,90,0,.08),
            transparent 30%
        ),

        #020202;

    transition:
        opacity 1s cubic-bezier(.16,1,.3,1),
        visibility 1s;
}

#startScreen.hide{
    opacity:0;

    visibility:hidden;

    pointer-events:none;
}

.start-background-glow{
    position:absolute;

    width:750px;
    height:750px;

    left:50%;
    top:50%;

    transform:
        translate(-50%,-50%);

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,70,0,.22),
            rgba(255,70,0,.06) 32%,
            transparent 70%
        );

    filter:blur(45px);

    animation:
        startGlow 5s ease-in-out infinite alternate;
}

@keyframes startGlow{

    from{
        transform:
            translate(-50%,-50%)
            scale(.82);

        opacity:.6;
    }

    to{
        transform:
            translate(-50%,-50%)
            scale(1.15);

        opacity:1;
    }

}

/* =========================================================
   GRID
========================================================= */

.start-grid{
    position:absolute;

    inset:-50%;

    opacity:.11;

    background-image:

        linear-gradient(
            rgba(255,100,30,.17) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            rgba(255,100,30,.17) 1px,
            transparent 1px
        );

    background-size:55px 55px;

    transform:
        perspective(500px)
        rotateX(65deg)
        translateY(100px)
        scale(1.5);

    mask-image:
        linear-gradient(
            to bottom,
            transparent,
            black 30%,
            black 70%,
            transparent
        );

    animation:
        gridMove 12s linear infinite;
}

@keyframes gridMove{

    from{
        background-position:0 0;
    }

    to{
        background-position:0 55px;
    }

}

/* =========================================================
   START CONTENT
========================================================= */

.start-content{
    position:relative;

    z-index:5;

    display:flex;

    flex-direction:column;

    align-items:center;

    text-align:center;

    animation:
        startContentIn 1.1s cubic-bezier(.16,1,.3,1);
}

@keyframes startContentIn{

    from{
        opacity:0;

        transform:
            translateY(40px)
            scale(.90);
    }

    to{
        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

}

/* =========================================================
   START LOGO
========================================================= */

.start-logo-area{
    position:relative;

    width:225px;
    height:225px;

    display:flex;

    justify-content:center;
    align-items:center;

    margin-bottom:20px;
}

.start-logo-glow{
    position:absolute;

    width:150px;
    height:150px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(255,90,0,.72),
            rgba(255,60,0,.20) 45%,
            transparent 72%
        );

    filter:blur(22px);

    animation:
        logoGlow 2.5s ease-in-out infinite alternate;
}

@keyframes logoGlow{

    from{
        transform:scale(.82);

        opacity:.55;
    }

    to{
        transform:scale(1.16);

        opacity:1;
    }

}

.start-logo{
    position:relative;

    z-index:3;

    width:145px;
    height:145px;

    object-fit:cover;

    border-radius:50%;

    border:
        2px solid
        rgba(255,120,50,.85);

    box-shadow:

        0 0 20px rgba(255,70,0,.45),

        0 0 70px rgba(255,70,0,.25),

        inset 0 0 30px rgba(255,255,255,.05);

    animation:
        logoFloat 3s ease-in-out infinite;
}

@keyframes logoFloat{

    0%,
    100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:
            translateY(-7px)
            scale(1.025);
    }

}

/* =========================================================
   ORBITS
========================================================= */

.start-orbit{
    position:absolute;

    border-radius:50%;

    border:
        1px solid
        rgba(255,100,30,.35);

    pointer-events:none;
}

.orbit-one{
    width:190px;
    height:190px;

    border-top-color:
        rgba(255,120,40,.95);

    border-bottom-color:
        transparent;

    animation:
        orbitSpin 5s linear infinite;
}

.orbit-two{
    width:210px;
    height:210px;

    border-left-color:
        rgba(255,80,0,.85);

    border-right-color:
        transparent;

    animation:
        orbitSpinReverse 7s linear infinite;
}

.orbit-three{
    width:225px;
    height:225px;

    border-top-color:
        rgba(255,160,70,.48);

    border-bottom-color:
        transparent;

    animation:
        orbitSpin 11s linear infinite;
}

@keyframes orbitSpin{

    to{
        transform:rotate(360deg);
    }

}

@keyframes orbitSpinReverse{

    to{
        transform:rotate(-360deg);
    }

}

/* =========================================================
   START TEXT
========================================================= */

.start-small{
    font-size:11px;

    letter-spacing:5px;

    font-weight:800;

    color:
        rgba(255,255,255,.42);

    margin-bottom:9px;
}

.start-title{
    font-size:56px;

    line-height:1;

    font-weight:900;

    letter-spacing:-3px;

    background:

        linear-gradient(
            90deg,
            #fff,
            #ff6500,
            #ffb067,
            #fff
        );

    background-size:250% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        titleGradient 5s linear infinite;

    filter:
        drop-shadow(
            0 0 20px rgba(255,80,0,.12)
        );
}

@keyframes titleGradient{

    to{
        background-position:250% center;
    }

}

.start-line{
    display:flex;

    align-items:center;

    gap:10px;

    width:190px;

    margin:19px 0 12px;
}

.start-line span{
    flex:1;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,100,30,.75)
        );
}

.start-line span:last-child{
    background:
        linear-gradient(
            90deg,
            rgba(255,100,30,.75),
            transparent
        );
}

.start-line i{
    font-size:5px;

    color:#ff6500;

    filter:
        drop-shadow(
            0 0 7px #ff6500
        );
}

.start-subtitle{
    min-height:18px;

    color:
        rgba(255,255,255,.42);

    font-size:13px;

    letter-spacing:.5px;
}

/* =========================================================
   ENTER BUTTON
========================================================= */

.start-button{
    position:relative;

    width:235px;
    height:62px;

    margin-top:29px;

    border:none;

    border-radius:18px;

    overflow:hidden;

    cursor:pointer;

    font-family:inherit;

    color:#fff;

    background:

        linear-gradient(
            135deg,
            #ff4d00,
            #ff7300
        );

    box-shadow:

        0 0 25px rgba(255,70,0,.35),

        0 15px 45px rgba(0,0,0,.55);

    transition:

        transform .3s cubic-bezier(.16,1,.3,1),

        box-shadow .3s ease,

        filter .3s ease;
}

.start-button:hover{

    transform:
        translateY(-5px)
        scale(1.035);

    filter:
        brightness(1.08);

    box-shadow:

        0 0 45px rgba(255,70,0,.55),

        0 20px 55px rgba(0,0,0,.55);
}

.start-button:active{

    transform:
        translateY(-1px)
        scale(.98);
}

.button-content{
    position:relative;

    z-index:3;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:11px;

    height:100%;

    font-size:14px;

    font-weight:900;

    letter-spacing:2px;
}

.button-content i{
    transition:
        transform .3s ease;
}

.start-button:hover .button-content i{
    transform:translateX(4px);
}

.button-shine{
    position:absolute;

    top:0;
    left:-100%;

    width:70%;
    height:100%;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.38),
            transparent
        );

    transform:skewX(-20deg);

    animation:
        buttonShine 3s ease-in-out infinite;
}

@keyframes buttonShine{

    0%{
        left:-100%;
    }

    45%,
    100%{
        left:140%;
    }

}

.start-hint{
    margin-top:15px;

    font-size:9px;

    letter-spacing:3px;

    color:
        rgba(255,255,255,.20);

    animation:
        hintPulse 2s ease-in-out infinite;
}

@keyframes hintPulse{

    50%{
        opacity:.42;
    }

}

/* =========================================================
   MAIN
========================================================= */

.wrapper{
    min-height:100vh;

    width:100%;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:25px;

    perspective:1200px;

    opacity:0;

    transform:
        scale(.94)
        translateY(15px);

    transition:
        opacity .85s cubic-bezier(.16,1,.3,1),
        transform .85s cubic-bezier(.16,1,.3,1);
}

.wrapper.show{
    opacity:1;

    transform:
        scale(1)
        translateY(0);
}

/* =========================================================
   CARD
========================================================= */

.card{
    position:relative;

    width:min(540px,100%);

    max-height:
        calc(100vh - 50px);

    padding:38px;

    border-radius:32px;

    background:

        linear-gradient(
            145deg,
            rgba(255,255,255,.075),
            rgba(255,255,255,.022)
        );

    border:
        1px solid
        rgba(255,255,255,.12);

    backdrop-filter:
        blur(35px)
        saturate(140%);

    -webkit-backdrop-filter:
        blur(35px)
        saturate(140%);

    box-shadow:

        0 35px 110px rgba(0,0,0,.78),

        inset 0 1px 0 rgba(255,255,255,.08),

        0 0 90px rgba(255,70,0,.04);

    transform-style:preserve-3d;

    transition:
        transform .12s ease-out;

    overflow-y:auto;

    scrollbar-width:none;
}

.card::-webkit-scrollbar{
    display:none;
}

.card::before{
    content:"";

    position:absolute;

    inset:0;

    border-radius:inherit;

    pointer-events:none;

    background:

        linear-gradient(
            135deg,
            rgba(255,100,0,.18),
            transparent 25%,
            transparent 75%,
            rgba(255,70,0,.08)
        );

    opacity:.8;
}

.card::after{
    content:"";

    position:absolute;

    left:12%;

    right:12%;

    top:0;

    height:1px;

    background:
        linear-gradient(
            90deg,
            transparent,
            rgba(255,120,50,.6),
            transparent
        );

    opacity:.7;
}

/* =========================================================
   PROFILE
========================================================= */

.profile{
    position:relative;

    z-index:2;

    text-align:center;
}

.avatar-box{
    position:relative;

    width:145px;
    height:145px;

    margin:0 auto;
}

.avatar-ring{
    position:absolute;

    inset:-5px;

    border-radius:50%;

    background:

        conic-gradient(
            from 0deg,
            #ff4d00,
            #ff9d00,
            #ff4d00,
            #6b1d00,
            #ff7a00,
            #ff4d00
        );

    animation:
        avatarRotate 6s linear infinite;

    filter:
        drop-shadow(
            0 0 18px
            rgba(255,70,0,.38)
        );
}

.avatar-ring::after{
    content:"";

    position:absolute;

    inset:3px;

    border-radius:50%;

    background:#050505;
}

.avatar{
    position:absolute;

    inset:5px;

    z-index:2;

    width:135px;
    height:135px;

    object-fit:cover;

    border-radius:50%;

    background:#050505;

    box-shadow:
        0 0 35px rgba(255,70,0,.14);
}

@keyframes avatarRotate{

    to{
        transform:rotate(360deg);
    }

}

/* =========================================================
   NAME
========================================================= */

.name{
    margin-top:21px;

    font-size:43px;

    font-weight:900;

    letter-spacing:-2px;

    background:

        linear-gradient(
            90deg,
            #fff,
            #ff8a00,
            #fff
        );

    background-size:200% auto;

    -webkit-background-clip:text;
    background-clip:text;

    color:transparent;

    animation:
        gradientMove 5s linear infinite;
}

@keyframes gradientMove{

    to{
        background-position:200% center;
    }

}

.description{
    margin-top:8px;

    color:
        rgba(255,255,255,.48);

    font-size:14px;
}

/* =========================================================
   STATUS
========================================================= */

.status{
    display:inline-flex;

    align-items:center;

    gap:8px;

    margin-top:15px;

    padding:8px 14px;

    border-radius:999px;

    background:
        rgba(255,255,255,.035);

    border:
        1px solid
        rgba(255,255,255,.08);

    color:
        rgba(255,255,255,.60);

    font-size:11px;

    font-weight:600;

    letter-spacing:.3px;
}

.status-dot{
    width:7px;
    height:7px;

    border-radius:50%;

    background:#ff6500;

    box-shadow:
        0 0 12px
        rgba(255,80,0,.9);

    animation:
        statusPulse 1.7s ease-in-out infinite;
}

@keyframes statusPulse{

    50%{
        opacity:.35;

        transform:scale(.7);
    }

}

/* =========================================================
   LINKS
========================================================= */

.links{
    position:relative;

    z-index:2;

    margin-top:27px;
}

.link{
    position:relative;

    width:100%;

    min-height:61px;

    margin:11px 0;

    display:flex;

    justify-content:center;

    align-items:center;

    gap:12px;

    border-radius:17px;

    color:#fff;

    text-decoration:none;

    font-size:15px;

    font-weight:700;

    background:
        rgba(255,255,255,.042);

    border:
        1px solid
        rgba(255,255,255,.085);

    overflow:hidden;

    transition:

        transform .28s cubic-bezier(.16,1,.3,1),

        background .28s ease,

        border-color .28s ease,

        box-shadow .28s ease;
}

.link::before{
    content:"";

    position:absolute;

    top:0;
    bottom:0;

    left:-120%;

    width:80%;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(255,255,255,.20),
            transparent
        );

    transform:skewX(-20deg);

    transition:left .65s ease;
}

.link:hover::before{
    left:140%;
}

.link:hover{

    transform:
        translateY(-4px)
        scale(1.015);

    background:

        linear-gradient(
            135deg,
            rgba(255,90,0,.13),
            rgba(255,255,255,.055)
        );

    border-color:
        rgba(255,100,0,.35);

    box-shadow:

        0 12px 35px rgba(0,0,0,.35),

        0 0 25px rgba(255,70,0,.08);
}

.link:active{

    transform:
        translateY(-1px)
        scale(.99);
}

.link i{
    width:23px;

    text-align:center;

    font-size:18px;

    transition:
        transform .3s ease,
        color .3s ease;
}

.link:hover i{
    transform:
        scale(1.12);
}

.kick-logo{
    width:23px;
    height:23px;

    object-fit:contain;

    transition:
        transform .3s ease;
}

.link:hover .kick-logo{
    transform:scale(1.12);
}

/* =========================================================
   LINK ARROW
========================================================= */

.link .arrow{
    position:absolute;

    right:20px;

    font-size:11px;

    color:
        rgba(255,255,255,.22);

    transition:

        transform .3s ease,

        color .3s ease;
}

.link:hover .arrow{

    transform:translateX(4px);

    color:
        rgba(255,120,40,.85);
}

/* =========================================================
   SPECIAL LINK
========================================================= */

.link.special{

    background:

        linear-gradient(
            135deg,
            rgba(255,80,0,.20),
            rgba(255,130,0,.055)
        );

    border-color:
        rgba(255,100,0,.38);

    box-shadow:
        0 0 25px rgba(255,70,0,.05);
}

.link.special:hover{

    background:

        linear-gradient(
            135deg,
            rgba(255,90,0,.27),
            rgba(255,130,0,.08)
        );

    border-color:
        rgba(255,120,40,.55);
}

/* =========================================================
   FOOTER
========================================================= */

.footer{
    position:relative;

    z-index:2;

    margin-top:23px;

    padding-top:4px;

    text-align:center;

    color:
        rgba(255,255,255,.22);

    font-size:10px;

    letter-spacing:1px;
}

/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:600px){

    body{
        overflow:auto;
    }

    #startScreen{
        overflow-y:auto;
    }

<script>

/* =========================================================
   BASIC PROTECTION
========================================================= */

/*
   Important:
   Client-side protection is not absolute.
   It only blocks normal browser actions.
*/


/* Disable right click */

document.addEventListener(
    "contextmenu",
    function(event){

        event.preventDefault();

        return false;

    },
    true
);


/* Disable text selection */

document.addEventListener(
    "selectstart",
    function(event){

        event.preventDefault();

        return false;

    },
    true
);


/* Disable dragging */

document.addEventListener(
    "dragstart",
    function(event){

        event.preventDefault();

        return false;

    },
    true
);


/* Disable middle mouse button */

document.addEventListener(
    "mousedown",
    function(event){

        if(event.button === 1){

            event.preventDefault();

            return false;

        }

    },
    true
);


/* =========================================================
   KEYBOARD PROTECTION
========================================================= */

document.addEventListener(
    "keydown",
    function(event){

        const key =
            event.key.toLowerCase();

        const ctrl =
            event.ctrlKey ||
            event.metaKey;

        const shift =
            event.shiftKey;

        /*
           F12
        */

        if(event.key === "F12"){

            event.preventDefault();

            return false;

        }


        /*
           Ctrl + Shift + I
           DevTools
        */

        if(
            ctrl &&
            shift &&
            key === "i"
        ){

            event.preventDefault();

            return false;

        }


        /*
           Ctrl + Shift + J
           Console
        */

        if(
            ctrl &&
            shift &&
            key === "j"
        ){

            event.preventDefault();

            return false;

        }


        /*
           Ctrl + Shift + C
           Inspect element
        */

        if(
            ctrl &&
            shift &&
            key === "c"
        ){

            event.preventDefault();

            return false;

        }


        /*
           Ctrl + U
           View source
        */

        if(
            ctrl &&
            key === "u"
        ){

            event.preventDefault();

            return false;

        }


        /*
           Ctrl + S
           Save page
        */

        if(
            ctrl &&
            key === "s"
        ){

            event.preventDefault();

            return false;

        }


        /*
           Ctrl + P
           Print
        */

        if(
            ctrl &&
            key === "p"
        ){

            event.preventDefault();

            return false;

        }


        /*
           Ctrl + C
           Copy
        */

        if(
            ctrl &&
            key === "c"
        ){

            event.preventDefault();

            return false;

        }


        /*
           Ctrl + X
           Cut
        */

        if(
            ctrl &&
            key === "x"
        ){

            event.preventDefault();

            return false;

        }


        /*
           Ctrl + A
           Select all
        */

        if(
            ctrl &&
            key === "a"
        ){

            event.preventDefault();

            return false;

        }


        /*
           Ctrl + Shift + S
        */

        if(
            ctrl &&
            shift &&
            key === "s"
        ){

            event.preventDefault();

            return false;

        }

    },
    true
);


/* =========================================================
   CLIPBOARD PROTECTION
========================================================= */

document.addEventListener(
    "copy",
    function(event){

        event.preventDefault();

        return false;

    },

);

document.addEventListener(

document.addEventListener(

        /*
           Prevent pasting into the page.
        */

        event.preventDefault();

        return false;

    },
    true
);


/* =========================================================
   START SCREEN
========================================================= */

const startScreen =
    document.getElementById("startScreen");

const enterButton =
    document.getElementById("enterButton");

const main =
    document.getElementById("main");

enterButton.addEventListener(
    "click",
    () => {

        startScreen.classList.add("hide");

        setTimeout(
            () => {

                main.classList.add("show");

            },
            250
        );

    }
);


/* =========================================================
   REMOVE EMPTY LINKS
========================================================= */

document
    .querySelectorAll(".social-link")
    .forEach(link => {

        const href =
            link
                .getAttribute("href")
                ?.trim();

        if(
            !href ||
            href === "#" ||
            href.toLowerCase() === "none"
        ){

            link.remove();

        }

    });


/* =========================================================
   CARD 3D EFFECT
========================================================= */

const card =
    document.getElementById("card");

let mouseX = 0;
let mouseY = 0;

let currentX = 0;
let currentY = 0;

document.addEventListener(
    "mousemove",
    event => {

        mouseX =
            (
                event.clientX /
                window.innerWidth
                - .5
            ) * 9;

        mouseY =
            (
                event.clientY /
                window.innerHeight
                - .5
            ) * -9;

    }
);

function smoothCard(){

    currentX +=
        (mouseX - currentX) * .08;

    currentY +=
        (mouseY - currentY) * .08;

    card.style.transform =
        `
        rotateX(${currentY}deg)
        rotateY(${currentX}deg)
        `;

    requestAnimationFrame(
        smoothCard
    );

}

smoothCard();


/* =========================================================
   CURSOR GLOW
========================================================= */

const cursorGlow =
    document.getElementById("cursorGlow");

let glowX = 0;
let glowY = 0;

let targetGlowX = 0;
let targetGlowY = 0;

document.addEventListener(
    "mousemove",
    event => {

        targetGlowX =
            event.clientX;

        targetGlowY =
            event.clientY;

    }
);

function animateCursorGlow(){

    glowX +=
        (targetGlowX - glowX) * .12;

    glowY +=
        (targetGlowY - glowY) * .12;

    cursorGlow.style.left =
        glowX + "px";

    cursorGlow.style.top =
        glowY + "px";

    requestAnimationFrame(
        animateCursorGlow
    );

}

animateCursorGlow();


/* =========================================================
   PARTICLES
========================================================= */

const canvas =
    document.getElementById("particles");

const ctx =
    canvas.getContext("2d");

let width = 0;
let height = 0;

let particles = [];

function resize(){

    width =
        window.innerWidth;

    height =
        window.innerHeight;

    const ratio =
        Math.min(
            window.devicePixelRatio || 1,
            2
        );

    canvas.width =
        width * ratio;

    canvas.height =
        height * ratio;

    canvas.style.width =
        width + "px";

    canvas.style.height =
        height + "px";

    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

    const amount =
        Math.min(
            95,
            Math.floor(
                width * height / 16000
            )
        );

    particles =
        Array.from(
            {length:amount},
            () => ({

                x:
                    Math.random() * width,

                y:
                    Math.random() * height,

                vx:
                    (Math.random() - .5) * .30,

                vy:
                    (Math.random() - .5) * .30,

                size:
                    Math.random() * 1.4 + .4,

                alpha:
                    Math.random() * .5 + .25

            })
        );

}

resize();

window.addEventListener(
    "resize",
    resize
);


function animateParticles(){

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    for(
        let i = 0;
        i < particles.length;
        i++
    ){

        const a =
            particles[i];

        a.x += a.vx;

        a.y += a.vy;


        if(
            a.x < -10 ||
            a.x > width + 10
        ){

            a.vx *= -1;

        }


        if(
            a.y < -10 ||
            a.y > height + 10
        ){

            a.vy *= -1;

        }


        ctx.fillStyle =
            `rgba(255,120,40,${a.alpha})`;

        ctx.beginPath();

        ctx.arc(
            a.x,
            a.y,
            a.size,
            0,
            Math.PI * 2
        );

        ctx.fill();


        for(
            let j = i + 1;
            j < particles.length;
            j++
        ){

            const b =
                particles[j];

            const dx =
                a.x - b.x;

            const dy =
                a.y - b.y;

            const distance =
                Math.sqrt(
                    dx * dx +
                    dy * dy
                );


            if(
                distance < 115
            ){

                const opacity =
                    (
                        1 -
                        distance / 115
                    ) * .16;

                ctx.strokeStyle =
                    `rgba(255,100,30,${opacity})`;

                ctx.lineWidth =
                    .55;

                ctx.beginPath();

                ctx.moveTo(
                    a.x,
                    a.y
                );

                ctx.lineTo(
                    b.x,
                    b.y
                );

                ctx.stroke();

            }

        }

    }

    requestAnimationFrame(
        animateParticles
    );

}

animateParticles();


/* =========================================================
   ENTER KEY
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if(
            event.key === "Enter" &&
            !startScreen.classList.contains("hide")
        ){

            enterButton.click();

        }

    }
);

</script>
